name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          xcodebuild
          -project Lurk.xcodeproj
          -scheme Lurk
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Test
        run: >
          xcodebuild
          -project Lurk.xcodeproj
          -scheme Lurk
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          test
